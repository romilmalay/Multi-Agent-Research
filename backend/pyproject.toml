[project]
name = "research-system"
version = "0.1.0"
description = "Multi-agent research pipeline (LangGraph) and its service layer."
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.9",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.0",
    "pyyaml>=6.0.2",
    "structlog>=25.1.0",
    "tenacity>=9.0.0",
    "langfuse>=3.0.0",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=4.3.1"]
openai = ["langchain-openai>=1.4.1"]

[dependency-groups]
api = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "langgraph-checkpoint-postgres>=3.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
research = "research_system.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_system", "app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["research_system", "app", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "research_system.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live' --cov=research_system --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "live: hits real APIs or network; excluded by default",
]

[tool.coverage.run]
branch = true

[tool.importlinter]
root_packages = ["research_system", "app"]

[[tool.importlinter.contracts]]
name = "research_system must not import app"
type = "forbidden"
source_modules = ["research_system"]
forbidden_modules = ["app"]
