repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      # --project keeps the repo root as cwd, so staged paths stay resolvable.
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types_or: [python, pyi]

      # Type check and import contracts see the whole project, not just staged files.
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: import-linter
        name: import-linter
        entry: uv run --directory backend lint-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
